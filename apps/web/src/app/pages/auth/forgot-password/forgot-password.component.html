<div class="flex flex-col gap-8">
    <div class="flex flex-col items-center gap-2 text-center">
        <h1 class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight">Reset your password</h1>
        <p class="text-surface-700 dark:text-surface-200 leading-normal">We'll send a reset link to your email address.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6" novalidate>
        <div class="flex flex-col gap-2">
            <label for="reset-email" class="text-surface-900 dark:text-surface-0 font-medium">Email address</label>
            <input pInputText id="reset-email" type="email" autocomplete="email" formControlName="email" placeholder="Email address" class="w-full px-3 py-2 shadow-sm rounded-lg" />
            @if (form.controls.email.touched && form.controls.email.invalid) { <small class="text-red-500">Enter a valid email address.</small> }
        </div>

        <button pButton type="submit" [loading]="authStore.authIsLoading()" class="w-full py-2 rounded-lg flex justify-center items-center gap-2">
            <i pButtonIcon class="pi pi-envelope text-base! leading-normal!"></i>
            <span pButtonLabel>Send reset link</span>
        </button>
    </form>

    <a routerLink="/auth/login" class="text-primary font-medium text-center hover:text-primary-emphasis">Back to sign in</a>
</div>
