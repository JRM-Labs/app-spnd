<div class="flex flex-col gap-8">
    <div class="flex flex-col items-center gap-2 text-center">
        <h1 class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight">Welcome back</h1>
        <p class="text-surface-700 dark:text-surface-200 leading-normal">Don't have an account? <a routerLink="/auth/register" class="text-primary font-medium ml-1 hover:text-primary-emphasis">Create today!</a></p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6" novalidate>
        <div class="flex flex-col gap-2">
            <label for="login-email" class="text-surface-900 dark:text-surface-0 font-medium">Email address</label>
            <input pInputText id="login-email" type="email" autocomplete="email" formControlName="email" placeholder="Email address" class="w-full px-3 py-2 shadow-sm rounded-lg" />
            @if (form.controls.email.touched && form.controls.email.invalid) { <small class="text-red-500">Enter a valid email address.</small> }
        </div>

        <div class="flex flex-col gap-2">
            <label for="login-password" class="text-surface-900 dark:text-surface-0 font-medium">Password</label>
            <input pInputText id="login-password" type="password" autocomplete="current-password" formControlName="password" placeholder="Password" class="w-full px-3 py-2 shadow-sm rounded-lg" />
            @if (form.controls.password.touched && form.controls.password.invalid) { <small class="text-red-500">Your password must be at least 6 characters.</small> }
        </div>

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-0">
            <div class="flex items-center gap-2">
                <p-checkbox inputId="remember-me" formControlName="rememberMe" [binary]="true" />
                <label for="remember-me" class="text-surface-900 dark:text-surface-0 leading-normal">Remember me</label>
            </div>
            <a routerLink="/auth/forgot-password" class="text-primary font-medium hover:text-primary-emphasis">Forgot your password?</a>
        </div>

        <button pButton type="submit" [loading]="authStore.authIsLoading()" class="w-full py-2 rounded-lg flex justify-center items-center gap-2">
            <i pButtonIcon class="pi pi-user text-base! leading-normal!"></i>
            <span pButtonLabel>Sign in</span>
        </button>
    </form>
</div>
